<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>usage-api</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181d;
    --panel-2: #1b2128;
    --fg: #e7ecf2;
    --muted: #8a96a4;
    --accent: #5cc8ff;
    --good: #6ee7a0;
    --warn: #ffcc66;
    --bad: #ff6b6b;
    --border: #232a32;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; letter-spacing: 0.02em; }
  header .meta { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 8px; padding: 14px 22px 0; }
  .tabs button { background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .tabs button.active { border-color: var(--accent); color: var(--accent); }
  .view.hidden { display: none; }
  main { padding: 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  .history { margin: 22px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .history-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .history-title { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .history-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .history button { background: var(--panel-2); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px; }
  .history button.active, .history button.checked { border-color: var(--accent); color: var(--accent); }
  .series-picker { position: relative; }
  .series-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; min-width: 180px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px; box-shadow: 0 12px 36px rgba(0,0,0,0.35); }
  .series-menu.hidden { display: none; }
  .series-menu button { display: block; width: 100%; text-align: left; margin: 2px 0; }
  .series-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .history svg { width: 100%; height: 260px; display: block; background: #0f1318; border: 1px solid var(--border); border-radius: 8px; }
  .history .axis { stroke: var(--border); stroke-width: 1; }
  .history .line { fill: none; stroke-width: 2; }
  .history .point { fill: var(--accent); opacity: 0.85; }
  .history .caption { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .card h2 { margin: 0; padding: 12px 14px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .card h2 .stamp { font-weight: normal; font-size: 11px; text-transform: none; letter-spacing: 0; }
  .card .body { padding: 12px 14px; }
  .row { display: grid; grid-template-columns: 110px 1fr 60px; gap: 10px; align-items: center; margin: 8px 0; }
  .row .label { color: var(--muted); font-size: 12px; }
  .row .pct { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 10px; background: var(--panel-2); border-radius: 5px; position: relative; overflow: hidden; border: 1px solid var(--border); }
  .bar > .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); transition: width 400ms ease; }
  .bar > .pace { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: 0.6; }
  .bar.good > .fill { background: var(--good); }
  .bar.warn > .fill { background: var(--warn); }
  .bar.bad > .fill { background: var(--bad); }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
  .group-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin: 14px 0 4px; padding-top: 8px; border-top: 1px dashed var(--border); }
  .err { color: var(--bad); font-size: 12px; padding: 6px 0; white-space: pre-wrap; }
  .empty { color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: var(--good); }
  .dot.err { background: var(--bad); }
  .dot.idle { background: var(--muted); }
  pre.json { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 11px; max-height: 200px; overflow: auto; color: var(--muted); }
  details > summary { cursor: pointer; color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<header>
  <h1>usage-api</h1>
  <div class="meta"><span id="status">connecting…</span> · refreshes every <span id="every">3</span>s · last <span id="ts">—</span></div>
</header>
<nav class="tabs" aria-label="dashboard views">
  <button type="button" data-view="cards" class="active">cards</button>
  <button type="button" data-view="history">graph</button>
</nav>
<main id="grid" class="view"></main>
<section class="history view hidden">
  <div class="history-head">
    <div>
      <div class="history-title">usage history</div>
      <div class="caption" id="history-caption">daily view · waiting for samples</div>
    </div>
    <div class="history-controls">
      <button type="button" data-granularity="daily" class="active">daily</button>
      <button type="button" data-granularity="hourly">hourly</button>
      <button type="button" data-granularity="fine">finest</button>
      <div class="series-picker">
        <button type="button" id="history-series-toggle" aria-expanded="false">series ▾</button>
        <div id="history-series-menu" class="series-menu hidden"></div>
      </div>
    </div>
  </div>
  <svg id="history-chart" viewBox="0 0 900 260" role="img" aria-label="usage history chart"></svg>
</section>

<script>
const REFRESH_MS = 3000;
const grid = document.getElementById("grid");
const statusEl = document.getElementById("status");
const tsEl = document.getElementById("ts");
const historyChart = document.getElementById("history-chart");
const historyCaption = document.getElementById("history-caption");
const historySeriesToggle = document.getElementById("history-series-toggle");
const historySeriesMenu = document.getElementById("history-series-menu");
const HISTORY_SERIES_STORAGE_KEY = "usage-api:selected-history-series";
const CURATED_HISTORY_SERIES = [
  { key: "claude:five_hour", label: "Claude 5-hour", color: "#5cc8ff", default: true },
  { key: "claude:seven_day", label: "Claude 7-day", color: "#6ee7a0", default: true },
  { key: "claude:seven_day_sonnet", label: "Claude Sonnet 7-day", color: "#34d399", default: false },
  { key: "claude:seven_day_opus", label: "Claude Opus 7-day", color: "#f472b6", default: false },
  { key: "claude:seven_day_design", label: "Claude Design 7-day", color: "#a78bfa", default: false },
  { key: "codex:primary", label: "Codex 5-hour", color: "#ffcc66", default: true },
  { key: "codex:secondary", label: "Codex 7-day", color: "#ff8f5c", default: true },
  { key: "zai:five_hour", label: "ZAI 5-hour", color: "#c084fc", default: true },
  { key: "zai:monthly", label: "ZAI monthly", color: "#facc15", default: false },
];
let historyGranularity = "daily";
let selectedSeriesKeys = loadSelectedSeriesKeys();
let latestHistory = null;
document.getElementById("every").textContent = (REFRESH_MS / 1000).toFixed(0);

function fmtPct(n) {
  if (n == null || !Number.isFinite(n)) return "—";
  return n.toFixed(1) + "%";
}
function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleString();
}
function fmtRel(iso) {
  if (!iso) return "—";
  const ms = new Date(iso).getTime() - Date.now();
  if (!Number.isFinite(ms)) return "—";
  const abs = Math.abs(ms);
  const totalMinutes = Math.round(abs / 60000);
  const days = Math.floor(totalMinutes / 1440);
  const hours = Math.floor((totalMinutes % 1440) / 60);
  const minutes = totalMinutes % 60;
  let s;
  if (days) {
    s = `${days}d${hours ? " " + hours + "h" : ""}`;
  } else {
    s = hours ? `${hours}h${minutes ? " " + minutes + "m" : ""}` : `${minutes}m`;
  }
  return ms >= 0 ? `in ${s}` : `${s} ago`;
}
function barClass(used, expected) {
  if (used == null) return "";
  if (expected == null) {
    if (used >= 90) return "bad";
    if (used >= 70) return "warn";
    return "good";
  }
  const slack = expected - used;
  if (slack < -10) return "bad";
  if (slack < 0) return "warn";
  return "good";
}
function bar(used, expected) {
  const cls = barClass(used, expected);
  const w = Math.max(0, Math.min(100, used ?? 0));
  const pace = expected != null && Number.isFinite(expected)
    ? `<div class="pace" style="left:${Math.max(0, Math.min(100, expected))}%"></div>`
    : "";
  return `<div class="bar ${cls}"><div class="fill" style="width:${w}%"></div>${pace}</div>`;
}
function metricRow(label, used, expected, resetIso) {
  return `
    <div class="row">
      <div class="label">${label}</div>
      ${bar(used, expected)}
      <div class="pct">${fmtPct(used)}</div>
    </div>
    <div class="sub">
      ${expected != null ? `pace ${fmtPct(expected)}` : ""}
      ${resetIso ? `· resets ${fmtRel(resetIso)} (${fmtTime(resetIso)})` : ""}
    </div>
  `;
}

function renderClaude(snap) {
  const d = snap.data;
  if (!d) return `<div class="empty">no data yet</div>`;
  const f = d.five_hour, w = d.seven_day;
  const sub = (label, b) => b ? metricRow(label, b.utilization, b.expected_percent, b.resets_at) : "";
  return `
    ${metricRow("5-hour", f?.utilization, f?.expected_percent, f?.resets_at)}
    ${metricRow("7-day", w?.utilization, w?.expected_percent, w?.resets_at)}
    ${sub("7-day Sonnet", d.seven_day_sonnet)}
    ${sub("7-day Opus", d.seven_day_opus)}
    ${sub("7-day Design", d.seven_day_design)}
  `;
}
function renderCodex(snap) {
  const d = snap.data;
  if (!d) return `<div class="empty">no data yet</div>`;
  const extras = (d.additional ?? []).map(a => `
    <div class="group-label">${escapeHtml(a.name)}</div>
    ${metricRow("primary", a.primary?.used_percent, a.primary?.expected_percent, a.primary?.resets_at)}
    ${metricRow("secondary", a.secondary?.used_percent, a.secondary?.expected_percent, a.secondary?.resets_at)}
  `).join("");
  return `
    ${metricRow("primary", d.primary?.used_percent, d.primary?.expected_percent, d.primary?.resets_at)}
    ${metricRow("secondary", d.secondary?.used_percent, d.secondary?.expected_percent, d.secondary?.resets_at)}
    ${extras}
  `;
}
function renderZai(snap) {
  const d = snap.data;
  if (!d) return `<div class="empty">no data yet</div>`;
  let out = "";
  if (d.five_hour) out += metricRow("5-hour", d.five_hour.used_percent, d.five_hour.expected_percent, d.five_hour.resets_at);
  if (d.monthly) out += metricRow("monthly", d.monthly.used_percent, d.monthly.expected_percent, d.monthly.resets_at);
  return out || `<div class="empty">no metrics</div>`;
}
function renderRaw(snap) {
  const d = snap.data;
  if (!d) return `<div class="empty">no data yet</div>`;
  return `<details><summary>raw</summary><pre class="json">${escapeHtml(JSON.stringify(d, null, 2))}</pre></details>`;
}
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

const RENDERERS = {
  claude: renderClaude,
  codex: renderCodex,
  zai: renderZai,
  openrouter: renderRaw,
  openai: renderRaw,
};

function statusDot(snap) {
  if (!snap) return `<span class="dot idle"></span>`;
  if (snap.error) return `<span class="dot err" title="${escapeHtml(String(snap.error))}"></span>`;
  if (snap.data) return `<span class="dot ok"></span>`;
  return `<span class="dot idle"></span>`;
}

function card(name, snap) {
  const renderer = RENDERERS[name] || renderRaw;
  const stamp = snap?.fetchedAt
    ? `fetched ${fmtRel(snap.fetchedAt)}${snap.intervalSec ? ` · every ${snap.intervalSec}s` : ""}`
    : "no fetch yet";
  const body = snap?.error
    ? `<div class="err">${escapeHtml(String(snap.error))}</div>${snap.data ? renderer(snap) : ""}`
    : renderer(snap || {});
  return `
    <section class="card">
      <h2>${statusDot(snap)}${name}<span class="stamp">${stamp}</span></h2>
      <div class="body">${body}</div>
    </section>
  `;
}

async function fetchHistory() {
  try {
    const r = await fetch(`/api/history?granularity=${encodeURIComponent(historyGranularity)}`, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    renderHistory(await r.json());
  } catch (err) {
    historyCaption.textContent = "history unavailable: " + (err?.message ?? err);
  }
}

function seriesKey(series) {
  return `${series.provider}:${series.metric}`;
}
function defaultSeriesKeys() {
  return CURATED_HISTORY_SERIES.filter(option => option.default).map(option => option.key);
}

function allSeriesKeys() {
  return CURATED_HISTORY_SERIES.map(option => option.key);
}

function loadSelectedSeriesKeys() {
  try {
    const raw = localStorage.getItem("usage-api:selected-history-series");
    if (raw) {
      const parsed = JSON.parse(raw).filter(key => allSeriesKeys().includes(key));
      if (parsed.length > 0) return new Set(parsed);
    }
  } catch {}
  return new Set(defaultSeriesKeys());
}

function saveSelectedSeriesKeys() {
  localStorage.setItem("usage-api:selected-history-series", JSON.stringify([...selectedSeriesKeys]));
}

function setSelectedSeriesKeys(keys) {
  selectedSeriesKeys = new Set(keys);
  saveSelectedSeriesKeys();
  if (latestHistory) renderHistory(latestHistory);
  else renderSeriesMenu();
}


function renderHistory(history) {
  latestHistory = history;
  renderSeriesMenu();
  const seriesMap = new Map((history.series ?? []).map(s => [seriesKey(s), s]));
  const selected = CURATED_HISTORY_SERIES
    .filter(option => selectedSeriesKeys.has(option.key))
    .map(option => ({ ...option, series: seriesMap.get(option.key) }))
    .filter(item => item.series && item.series.points.length > 0);

  if (selected.length === 0) {
    historyChart.innerHTML = `<text x="450" y="130" text-anchor="middle" fill="#8a96a4">waiting for selected usage samples</text>`;
    historyCaption.textContent = `${history.granularity ?? historyGranularity} view · stores last ${history.retentionDays ?? 8} days`;
    return;
  }

  const allPoints = selected.flatMap(item => item.series.points);
  const width = 900, height = 260, pad = 32;
  const times = allPoints.map(p => new Date(p.t).getTime()).filter(Number.isFinite);
  const minT = Math.min(...times), maxT = Math.max(...times);
  const x = t => maxT === minT ? width / 2 : pad + ((t - minT) / (maxT - minT)) * (width - pad * 2);
  const y = v => height - pad - (Math.max(0, Math.min(100, v)) / 100) * (height - pad * 2);
  const lines = selected.map(item => {
    const coords = item.series.points
      .map(p => `${x(new Date(p.t).getTime()).toFixed(1)},${y(p.value).toFixed(1)}`)
      .join(" ");
    const dotEvery = Math.max(1, Math.ceil(item.series.points.length / 50));
    const dots = item.series.points
      .filter((_p, i) => i % dotEvery === 0 || i === item.series.points.length - 1)
      .map(p => `<circle class="point" fill="${item.color}" cx="${x(new Date(p.t).getTime()).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="2"><title>${escapeHtml(item.label)} · ${fmtTime(p.t)} · ${fmtPct(p.value)} · ${p.count} sample${p.count === 1 ? "" : "s"}</title></circle>`)
      .join("");
    return `<polyline class="line" stroke="${item.color}" points="${coords}"></polyline>${dots}`;
  }).join("");
  const legend = selected.map((item, i) => `
    <g transform="translate(${pad + i * 160},18)">
      <rect width="10" height="10" fill="${item.color}" rx="2"></rect>
      <text x="16" y="10" fill="#8a96a4" font-size="11">${escapeHtml(item.label)}</text>
    </g>
  `).join("");
  historyChart.innerHTML = `
    <line class="axis" x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}"></line>
    <line class="axis" x1="${pad}" y1="${pad}" x2="${pad}" y2="${height - pad}"></line>
    <text x="${pad}" y="${pad - 8}" fill="#8a96a4" font-size="11">100%</text>
    <text x="${pad}" y="${height - 8}" fill="#8a96a4" font-size="11">0%</text>
    ${legend}
    ${lines}
  `;
  const first = fmtTime(new Date(minT).toISOString());
  const last = fmtTime(new Date(maxT).toISOString());
  historyCaption.textContent = `${history.granularity} · ${selected.length} selected · ${allPoints.length} point${allPoints.length === 1 ? "" : "s"} · ${first} → ${last}`;
}

function renderSeriesMenu() {
  historySeriesToggle.textContent = `series (${selectedSeriesKeys.size}) ▾`;
  const actions = `
    <div class="series-actions">
      <button type="button" data-series-action="all">all</button>
      <button type="button" data-series-action="none">none</button>
      <button type="button" data-series-action="default">default</button>
    </div>
  `;
  const options = CURATED_HISTORY_SERIES.map(option => {
    const checked = selectedSeriesKeys.has(option.key);
    return `<button type="button" class="${checked ? "checked" : ""}" data-series-key="${escapeHtml(option.key)}"><span style="color:${option.color}">●</span> ${checked ? "✓" : "＋"} ${escapeHtml(option.label)}</button>`;
  }).join("");
  historySeriesMenu.innerHTML = actions + options;
}

function toggleSeriesMenu() {
  const isHidden = historySeriesMenu.classList.toggle("hidden");
  historySeriesToggle.setAttribute("aria-expanded", String(!isHidden));
}

historySeriesToggle.addEventListener("click", toggleSeriesMenu);
historySeriesMenu.addEventListener("click", (event) => {
  const actionButton = event.target.closest("[data-series-action]");
  if (actionButton) {
    const action = actionButton.dataset.seriesAction;
    if (action === "all") setSelectedSeriesKeys(allSeriesKeys());
    if (action === "none") setSelectedSeriesKeys([]);
    if (action === "default") setSelectedSeriesKeys(defaultSeriesKeys());
    return;
  }
  const button = event.target.closest("[data-series-key]");
  if (!button) return;
  const key = button.dataset.seriesKey;
  if (selectedSeriesKeys.has(key)) selectedSeriesKeys.delete(key);
  else selectedSeriesKeys.add(key);
  saveSelectedSeriesKeys();
  if (latestHistory) renderHistory(latestHistory);
  else renderSeriesMenu();
});
document.querySelectorAll("[data-view]").forEach(button => {
  button.addEventListener("click", () => {
    const view = button.dataset.view;
    document.querySelectorAll("[data-view]").forEach(b => b.classList.toggle("active", b === button));
    grid.classList.toggle("hidden", view !== "cards");
    document.querySelector(".history").classList.toggle("hidden", view !== "history");
    if (view === "history") fetchHistory();
  });
});
document.querySelectorAll("[data-granularity]").forEach(button => {
  button.addEventListener("click", () => {
    historyGranularity = button.dataset.granularity;
    document.querySelectorAll("[data-granularity]").forEach(b => b.classList.toggle("active", b === button));
    fetchHistory();
  });
});
renderSeriesMenu();

async function tick() {
  try {
    const r = await fetch("/api/usage", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    statusEl.textContent = "live";
    tsEl.textContent = fmtTime(j.timestamp);
    const order = ["claude", "codex", "zai", "openrouter", "openai"];
    grid.innerHTML = order.map(n => card(n, j.providers[n])).join("");
  } catch (err) {
    statusEl.textContent = "error: " + (err?.message ?? err);
  }
}

tick();
fetchHistory();
setInterval(tick, REFRESH_MS);
setInterval(fetchHistory, REFRESH_MS * 10);
</script>
</body>
</html>
